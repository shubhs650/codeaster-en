name: llm-bundle

# Task 5.5 (ADR-025): build the LLM context bundles with `caen bundle` and publish them as
# release assets.
# - push to main (bundle sources changed) or workflow_dispatch: rebuild and replace the assets
#   of the rolling pre-release `llm-bundle`, whose tag is moved to the built commit.
# - release published: also attach the bundles to that release.
# The Tier 1 compact bundle must stay under the 150k-token budget (PLAN 5.5); the build fails
# otherwise. The other three have no budget: they are for larger context windows.

on:
  push:
    branches: [main]
    paths:
      - en/guide/**
      - en/commands/*.md
      - en/glossary.yaml
      - docs/COMMAND-SET.md
      - UPSTREAM_VERSION
      - tools/codeaster_en/bundle.py
      - tools/codeaster_en/__init__.py
      - .github/workflows/llm-bundle.yml
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: llm-bundle
  cancel-in-progress: false

jobs:
  bundle:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1 # no submodule: the bundle reads en/ and docs/ only

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tools/pyproject.toml

      - name: Install tools
        run: pip install -e tools

      - name: Build the bundles
        run: |
          mkdir -p dist
          caen bundle --tier 1 --out dist/codeaster-en-tier1-compact.md | tee dist/sizes.txt
          caen bundle --tier 1 --detail full --max-tokens 0 --out dist/codeaster-en-tier1-full.md | tee -a dist/sizes.txt
          caen bundle --tier 2 --max-tokens 0 --out dist/codeaster-en-tier2-compact.md | tee -a dist/sizes.txt
          caen bundle --tier 2 --detail full --max-tokens 0 --out dist/codeaster-en-tier2-full.md | tee -a dist/sizes.txt

      - uses: actions/upload-artifact@v4
        with:
          name: llm-bundle
          path: dist/

      - name: Attach to the published release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*.md --clobber

      - name: Update the rolling pre-release llm-bundle
        if: github.event_name != 'release' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="$(printf 'LLM context bundles built by `caen bundle` from %s (%s).\n\nStart with `codeaster-en-tier1-compact.md` (fits a 200k-token context window). The `full` bundles keep every page whole, for larger windows. Sizes (tokens are estimated, ADR-025):\n\n```text\n%s\n```\n' \
            "${GITHUB_SHA::7}" "$(grep -v '^#' UPSTREAM_VERSION | head -1)" "$(cat dist/sizes.txt)")"
          git tag -f llm-bundle "$GITHUB_SHA"
          git push -f origin refs/tags/llm-bundle
          if gh release view llm-bundle >/dev/null 2>&1; then
            gh release edit llm-bundle --prerelease --notes "$notes"
          else
            gh release create llm-bundle --prerelease --title "LLM context bundle (latest main)" \
              --notes "$notes" --verify-tag
          fi
          gh release upload llm-bundle dist/*.md --clobber
