name: ci

on:
  pull_request:
  push:
    branches: [main]
  # upstream-bump.yml (task 7.2) dispatches this on its branch: a push or PR made with
  # GITHUB_TOKEN does not trigger pull_request/push runs.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true # upstream/ (shallow per .gitmodules)
          fetch-depth: 1

      - name: Check upstream pin matches UPSTREAM_VERSION
        run: |
          want="$(grep -v '^#' UPSTREAM_VERSION | head -1 | tr -d '[:space:]')"
          have="$(git -C upstream rev-parse HEAD)"
          # ls-remote, not a shallow fetch: fetching into the shallow submodule
          # failed with "shallow file has changed since we read it".
          # "^{}" is the commit an annotated tag points to; fall back for a lightweight tag.
          tag="$(git -C upstream ls-remote origin "refs/tags/${want}^{}" | cut -f1)"
          [ -n "${tag}" ] || tag="$(git -C upstream ls-remote origin "refs/tags/${want}" | cut -f1)"
          [ -n "${tag}" ] || { echo "tag ${want} not found in upstream remote"; exit 1; }
          echo "UPSTREAM_VERSION=${want} -> ${tag}; submodule at ${have}"
          test "${have}" = "${tag}"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tools/pyproject.toml

      - name: Install system libraries for WeasyPrint (report PDF) and OSMesa (report images)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libosmesa6

      - name: Install tools
        run: pip install -e "tools[dev]"

      - name: ruff check
        run: ruff check .

      - name: ruff format
        run: ruff format --check .

      - name: pytest
        run: pytest -q

      - name: caen validate
        run: caen validate

  # Task 6.2 (ADR-020): build the sdist and wheel, install the wheel in a clean venv and use it
  # from outside the checkout. The wheel is kept as a run artifact; nothing is published.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1 # no submodule: the wheel must not need upstream/

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build, install in a clean venv, smoke test
        run: |
          pip install build
          scripts/check-wheel.sh dist

      - uses: actions/upload-artifact@v4
        with:
          name: codeaster-en-dist
          path: dist/
          retention-days: 14
