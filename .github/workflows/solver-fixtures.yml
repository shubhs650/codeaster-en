name: solver-fixtures

# Runs the solver fixtures with the pinned code_aster image (CONTAINER_IMAGE, ADR-011) and checks
# the outputs: tests/test_fixture_outputs.py for the three reference cases (clean exit, no alarm,
# every TEST_RESU OK, VALE_CALC equal to the solver's values), tests/test_mess.py for every
# log, including the broken_* runs that fail on purpose (task 4.3), and tests/test_mess_render.py
# (every diagnostic renders in English, task 4.4).
# - pull_request (fixture inputs, image or pin changed): verify only; outputs are uploaded as an
#   artifact, nothing is committed.
# - workflow_dispatch: verify, then commit the regenerated outputs on a new branch and open a PR.
#
# The optional `english` job (task 3.4, ADR-004) reruns EN_CASES with DEBUT(LANG="EN") and our
# gettext catalog built from en/messages (FIXTURE_LANG=EN scripts/run-fixture.sh), checks them
# with tests/test_gettext.py and, on workflow_dispatch with `english` ticked, commits
# tests/fixtures/<case>/output_en/ the same way. Rerun it after editing messages that the
# fixtures print, or test_gettext.py skips its renderer check for the stale logs.

on:
  workflow_dispatch:
    inputs:
      english:
        description: "Also run the English-locale fixtures and commit output_en/"
        type: boolean
        default: true
  pull_request:
    paths:
      - UPSTREAM_VERSION
      - CONTAINER_IMAGE
      - tests/fixtures/**/input/**
      - tests/test_fixture_outputs.py
      - tests/test_mess.py
      - tests/test_mess_render.py
      - scripts/run-fixture.sh
      - .github/workflows/solver-fixtures.yml
      - en/messages/codeaster_en.po
      - tools/codeaster_en/translate/gettext_po.py
      - tests/test_gettext.py

permissions:
  contents: read

jobs:
  run-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tools/pyproject.toml

      - name: Install tools
        run: pip install -e "tools[dev]"

      - name: Pull solver image
        run: docker pull -q "$(grep -v '^#' CONTAINER_IMAGE | tr -d '[:space:]')"

      - name: Run fixtures
        env:
          FIXTURE_RUN_BY: "solver-fixtures.yml run ${{ github.run_id }}"
        run: |
          for case in tests/fixtures/*/input; do
            scripts/run-fixture.sh "$(dirname "$case")"
          done

      - name: Check outputs
        run: pytest -q tests/test_fixture_outputs.py tests/test_mess.py tests/test_mess_render.py tests/test_results.py

      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fixture-outputs
          path: tests/fixtures/*/output/

      - name: Commit outputs and open a PR
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="fixtures/regen-${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add tests/fixtures/*/output
          if git diff --cached --quiet; then echo "outputs unchanged"; exit 0; fi
          git commit -s -m "fixtures: regenerate solver outputs (run ${{ github.run_id }})"
          git push origin "$branch"
          gh pr create --base "${{ github.ref_name }}" --head "$branch" \
            --title "fixtures: regenerate solver outputs" \
            --body "Outputs regenerated by solver-fixtures.yml run ${{ github.run_id }} with $(grep -v '^#' CONTAINER_IMAGE). All TEST_RESU OK (tests/test_fixture_outputs.py)." \
            || echo "::warning::Could not open the PR (Actions may not be allowed to create PRs); branch $branch is pushed."

  english:
    if: github.event_name == 'pull_request' || inputs.english
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    env:
      EN_CASES: solid_static shell_static modal broken_missing_group
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tools/pyproject.toml

      - name: Install tools and msgfmt
        run: |
          pip install -e "tools[dev]"
          sudo apt-get install -y -q gettext

      - name: Pull solver image
        run: docker pull -q "$(grep -v '^#' CONTAINER_IMAGE | tr -d '[:space:]')"

      - name: Run fixtures with the English catalog
        env:
          FIXTURE_LANG: EN
          FIXTURE_RUN_BY: "solver-fixtures.yml english run ${{ github.run_id }}"
        run: |
          for case in $EN_CASES; do
            scripts/run-fixture.sh "tests/fixtures/$case"
          done

      - name: Check outputs
        run: pytest -q tests/test_gettext.py

      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fixture-outputs-en
          path: tests/fixtures/*/output_en/

      - name: Commit outputs and open a PR
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="fixtures/regen-en-${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add tests/fixtures/*/output_en
          if git diff --cached --quiet; then echo "outputs unchanged"; exit 0; fi
          git commit -s -m "fixtures: regenerate English-locale solver logs (run ${{ github.run_id }})"
          git push origin "$branch"
          gh pr create --base "${{ github.ref_name }}" --head "$branch" \
            --title "fixtures: regenerate English-locale solver logs" \
            --body "English-locale logs (DEBUT(LANG='EN') + en/messages/codeaster_en.po) regenerated by solver-fixtures.yml run ${{ github.run_id }} with $(grep -v '^#' CONTAINER_IMAGE)." \
            || echo "::warning::Could not open the PR (Actions may not be allowed to create PRs); branch $branch is pushed."
