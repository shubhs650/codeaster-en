# Seed glossary — codeaster-en
# Controlled French → English vocabulary. One entry per French identifier/term.
# `en` is the ONLY permitted translation; `aliases_en` are forbidden synonyms the validator rejects.
# kind: command | keyword | value | concept | term | abbrev
# status: proposed | machine | reviewed
#
# Seeded 2026-10-22 from engineering usage. To be merged with AsterStudy's GLOBAL_DICT
# (Copyright 2016 EDF R&D, GPL-3; gitlab.com/salomemeca/modules/salome-asterstudy) in task 0.6.
# Everything here is `proposed` until an engineer reviews it.

# ---------- abbreviations that appear inside keyword names ----------
- {fr: MA,    en: element,            kind: abbrev, note: "maille. GROUP_MA = element group. Never 'cell'.", aliases_en: [cell, mesh element], status: proposed}
- {fr: NO,    en: node,               kind: abbrev, note: "noeud. GROUP_NO = node group.", aliases_en: [vertex], status: proposed}
- {fr: CARA,  en: properties,         kind: abbrev, note: "caractéristiques. AFFE_CARA_ELEM = element properties (thickness, section, spring).", aliases_en: [characteristics], status: proposed}
- {fr: CHAM,  en: field,              kind: abbrev, note: "champ. CHAM_MATER = material field; CREA_CHAMP = create field.", status: proposed}
- {fr: CHAR,  en: load,               kind: abbrev, note: "charge/chargement. AFFE_CHAR_MECA = assign mechanical loads and BCs.", aliases_en: [charge], status: proposed}
- {fr: CINE,  en: kinematic,          kind: abbrev, note: "cinématique. AFFE_CHAR_CINE = kinematic (eliminated, non-Lagrange) BCs.", status: proposed}
- {fr: SIGM,  en: stress,             kind: abbrev, note: "contrainte (sigma). SIGM_ELNO, SIGM_NOEU.", status: proposed}
- {fr: SIEF,  en: stress (integration-point field), kind: abbrev, note: "contraintes/efforts: the raw stress field computed at Gauss points (SIEF_ELGA).", status: proposed}
- {fr: SIEQ,  en: equivalent stress,  kind: abbrev, note: "contraintes équivalentes: von Mises, Tresca, principals. SIEQ_ELNO, SIEQ_NOEU.", status: proposed}
- {fr: EPSI,  en: strain,             kind: abbrev, note: "déformation. EPSI_ELNO, EPSI_NOEU.", status: proposed}
- {fr: EFGE,  en: generalized forces, kind: abbrev, note: "efforts généralisés: shell/beam stress resultants (N, M, Q). EFGE_ELNO.", status: proposed}
- {fr: REAC,  en: reaction,           kind: abbrev, note: "réaction. REAC_NODA = nodal reactions.", status: proposed}
- {fr: FORC,  en: force,              kind: abbrev, note: "FORC_NODA = nodal forces (internal, = assembled element forces).", status: proposed}
- {fr: ELGA,  en: at Gauss points,    kind: abbrev, note: "élément, points de Gauss. Field location.", aliases_en: [at integration points], status: proposed}
- {fr: ELNO,  en: at element nodes,   kind: abbrev, note: "élément, noeuds: extrapolated to nodes, not averaged between elements.", status: proposed}
- {fr: NOEU,  en: at nodes (averaged), kind: abbrev, note: "noeuds: nodal field averaged across adjoining elements.", status: proposed}
- {fr: MECA,  en: mechanical,         kind: abbrev, note: "mécanique.", status: proposed}
- {fr: THER,  en: thermal,            kind: abbrev, note: "thermique.", status: proposed}
- {fr: RESU,  en: result,             kind: abbrev, note: "résultat. IMPR_RESU, TEST_RESU, RESULTAT keyword.", status: proposed}
- {fr: IMPR,  en: write (print),      kind: abbrev, note: "imprimer: write to file. IMPR_RESU, IMPR_TABLE.", aliases_en: [impress], status: proposed}
- {fr: LIRE,  en: read,               kind: abbrev, note: "lire. LIRE_MAILLAGE.", status: proposed}
- {fr: DEFI,  en: define,             kind: abbrev, note: "définir. DEFI_MATERIAU, DEFI_FONCTION, DEFI_GROUP.", status: proposed}
- {fr: AFFE,  en: assign,             kind: abbrev, note: "affecter. AFFE_MODELE, AFFE_MATERIAU, AFFE keyword block.", aliases_en: [affect, affectation], status: proposed}
- {fr: CALC,  en: compute,            kind: abbrev, note: "calculer. CALC_CHAMP, CALC_MODES.", status: proposed}
- {fr: POST,  en: post-process,       kind: abbrev, note: "POST_RELEVE_T, POST_ELEM.", status: proposed}
- {fr: CREA,  en: create,             kind: abbrev, note: "créer. CREA_CHAMP, CREA_MAILLAGE.", status: proposed}
- {fr: MODI,  en: modify,             kind: abbrev, note: "modifier. MODI_MAILLAGE.", status: proposed}
- {fr: ASSE,  en: assemble,           kind: abbrev, note: "assembler. ASSE_MATRICE, ASSEMBLAGE.", status: proposed}
- {fr: NUME,  en: numbering,          kind: abbrev, note: "numérotation. NUME_DDL = DOF numbering; NUME_ORDRE = result step index.", status: proposed}
- {fr: MACR,  en: macro,              kind: abbrev, note: "MACR_LIGN_COUPE etc.: macro-commands built from others.", status: proposed}

# ---------- core concepts ----------
- {fr: maillage,        en: mesh,                 kind: term, status: proposed}
- {fr: maille,          en: element,              kind: term, aliases_en: [cell], status: proposed}
- {fr: noeud,           en: node,                 kind: term, aliases_en: [vertex], status: proposed}
- {fr: modèle,          en: model,                kind: term, note: "The mesh + element formulation assignment (result of AFFE_MODELE).", status: proposed}
- {fr: modélisation,    en: modeling type,        kind: term, note: "Element formulation family: 3D, DKT, AXIS… Not 'modelization'.", aliases_en: [modelization, modelisation], status: proposed}
- {fr: phénomène,       en: physics,              kind: term, note: "PHENOMENE = 'MECANIQUE' | 'THERMIQUE' | 'ACOUSTIQUE'.", aliases_en: [phenomenon], status: proposed}
- {fr: concept,         en: result object,        kind: term, note: "A named object produced by a command (mesh, model, field, result). Keep '(concept)' once at first use in docs.", status: proposed}
- {fr: structure de données (SD), en: data structure, kind: term, note: "Internal storage of a concept. Rarely user-facing.", status: proposed}
- {fr: matériau,        en: material,             kind: term, status: proposed}
- {fr: champ de matériau, en: material field,     kind: term, note: "CHAM_MATER: which material applies where (result of AFFE_MATERIAU).", status: proposed}
- {fr: chargement,      en: load,                 kind: term, aliases_en: [charge, loading], status: proposed}
- {fr: cas de charge,   en: load case,            kind: term, status: proposed}
- {fr: conditions aux limites, en: boundary conditions, kind: term, status: proposed}
- {fr: dualisation,     en: Lagrange-multiplier enforcement, kind: term, note: "BCs applied via Lagrange multipliers (AFFE_CHAR_MECA) vs eliminated (AFFE_CHAR_CINE).", aliases_en: [dualization], status: proposed}
- {fr: degré de liberté (DDL), en: degree of freedom (DOF), kind: term, status: proposed}
- {fr: unité logique,   en: logical unit,         kind: term, note: "Numbered file slot (UNITE=20) mapped to a file in the .export.", status: proposed}
- {fr: fichier de commandes, en: command file,    kind: term, note: ".comm file.", status: proposed}
- {fr: fichier .mess,   en: log file,             kind: term, note: "Solver message log.", status: proposed}
- {fr: alarme,          en: warning,              kind: term, note: "<A> in the log. Never 'alarm'.", aliases_en: [alarm], status: proposed}
- {fr: erreur fatale,   en: fatal error,          kind: term, note: "<F>.", status: proposed}
- {fr: erreur,          en: error,                kind: term, note: "<E>.", status: proposed}
- {fr: instant,         en: time step,            kind: term, note: "INST: pseudo-time / load-step parameter of a result.", aliases_en: [instant], status: proposed}
- {fr: numéro d'ordre,  en: step index,           kind: term, note: "NUME_ORDRE.", status: proposed}
- {fr: groupe de mailles, en: element group,      kind: term, aliases_en: [cell group, mesh group], status: proposed}
- {fr: groupe de noeuds, en: node group,          kind: term, status: proposed}
- {fr: peau,            en: boundary (skin) elements, kind: term, note: "ORIE_PEAU: orient 2D boundary elements of a 3D mesh outward.", status: proposed}
- {fr: coque,           en: shell,                kind: term, status: proposed}
- {fr: plaque,          en: plate,                kind: term, status: proposed}
- {fr: poutre,          en: beam,                 kind: term, status: proposed}
- {fr: épaisseur,       en: thickness,            kind: term, status: proposed}
- {fr: couche,          en: layer,                kind: term, note: "COQUE_NCOU: number of through-thickness layers for stress recovery.", status: proposed}
- {fr: raideur,         en: stiffness,            kind: term, status: proposed}
- {fr: rigidité,        en: stiffness,            kind: term, note: "RIGI_MECA = stiffness matrix.", status: proposed}
- {fr: masse,           en: mass,                 kind: term, note: "MASS_MECA = mass matrix; MASS_INER = mass/inertia properties.", status: proposed}
- {fr: fréquence propre, en: natural frequency,   kind: term, status: proposed}
- {fr: mode propre,     en: mode shape,           kind: term, status: proposed}
- {fr: masse effective, en: effective mass,       kind: term, note: "MASS_EFFE: modal effective mass; MASS_EFFE_UN = unit-normalised fraction.", status: proposed}
- {fr: résultante,      en: resultant,            kind: term, status: proposed}
- {fr: contrainte équivalente de von Mises, en: von Mises stress, kind: term, status: proposed}
- {fr: contrainte principale, en: principal stress, kind: term, status: proposed}
- {fr: solveur,         en: solver,               kind: term, note: "SOLVEUR = linear solver settings (MUMPS, MULT_FRONT, PETSC).", status: proposed}
- {fr: factorisation,   en: factorization,        kind: term, status: proposed}
- {fr: pivot nul,       en: zero pivot,           kind: term, note: "Singular matrix: usually missing BCs or unconnected parts.", status: proposed}
- {fr: convergence,     en: convergence,          kind: term, status: proposed}
- {fr: pas de temps,    en: time step,            kind: term, status: proposed}
- {fr: liaison,         en: constraint (coupling), kind: term, note: "LIAISON_* keywords: linear relations between DOFs (tie, rigid, RBE3).", aliases_en: [link, connection], status: proposed}
- {fr: maître / esclave, en: main / secondary,     kind: term, note: "MAIT/ESCL in LIAISON_MAIL, contact. Use main/secondary consistently.", aliases_en: [master/slave], status: proposed}
- {fr: repère,          en: coordinate system,    kind: term, note: "REPERE='GLOBAL'|'LOCAL'|'UTILISATEUR'.", aliases_en: [frame, reference], status: proposed}
- {fr: fonction,        en: function,             kind: term, note: "DEFI_FONCTION: tabulated function of a parameter (INST, X, Y, Z, TEMP).", status: proposed}
- {fr: prolongement,    en: extrapolation (outside table range), kind: term, note: "PROL_DROITE/PROL_GAUCHE = right/left extension: 'CONSTANT', 'LINEAIRE', 'EXCLU'.", status: proposed}

