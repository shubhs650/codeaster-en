# Seed glossary — codeaster-en
# Controlled French → English vocabulary. One entry per French identifier/term.
# `en` is the ONLY permitted translation; `aliases_en` are forbidden synonyms the validator rejects.
# kind: command | keyword | value | concept | term | abbrev
# status: proposed | machine | reviewed
#
# Seeded 2026-10-22 from engineering usage; merged with AsterStudy's GLOBAL_DICT in task 0.6
# (Copyright 2016 EDF R&D, GPL-3; see the GLOBAL_DICT section below). Entries GLOBAL_DICT also
# defines carry `asterstudy:` with its English verbatim; our `en` stays authoritative.
# Task 2.1 (2026-10-29) gave every entry except `kind: value` a `note` (catalog fr= string, usage,
# or what the abbreviation stands for) and set every entry to `machine`: agent-drafted, unreviewed.
# New entries start as `proposed`. Only the owner sets `reviewed`.

# ---------- abbreviations that appear inside keyword names ----------
- {fr: MA,    en: element,            kind: abbrev, note: "maille. GROUP_MA = element group. Never 'cell'.", aliases_en: [cell, mesh element], status: machine}
- {fr: NO,    en: node,               kind: abbrev, note: "noeud. GROUP_NO = node group.", aliases_en: [vertex], status: machine}
- {fr: CARA,  en: properties,         kind: abbrev, note: "caractéristiques. AFFE_CARA_ELEM = element properties (thickness, section, spring).", aliases_en: [element characteristics], status: machine}
- {fr: CHAM,  en: field,              kind: abbrev, note: "champ. CHAM_MATER = material field; CREA_CHAMP = create field.", status: machine}
- {fr: CHAR,  en: load,               kind: abbrev, note: "charge/chargement. AFFE_CHAR_MECA = assign mechanical loads and BCs.", aliases_en: [charge], status: machine}
- {fr: CINE,  en: kinematic,          kind: abbrev, note: "cinématique. AFFE_CHAR_CINE = kinematic (eliminated, non-Lagrange) BCs.", status: machine}
- {fr: SIGM,  en: stress,             kind: abbrev, note: "contrainte (sigma). SIGM_ELNO, SIGM_NOEU.", status: machine}
- {fr: SIEF,  en: stress (integration-point field), kind: abbrev, note: "contraintes/efforts: the raw stress field computed at Gauss points (SIEF_ELGA).", status: machine}
- {fr: SIEQ,  en: equivalent stress,  kind: abbrev, note: "contraintes équivalentes: von Mises, Tresca, principals. SIEQ_ELNO, SIEQ_NOEU.", status: machine}
- {fr: EPSI,  en: strain,             kind: abbrev, note: "déformation. EPSI_ELNO, EPSI_NOEU.", status: machine}
- {fr: EFGE,  en: generalized forces, kind: abbrev, note: "efforts généralisés: shell/beam stress resultants (N, M, Q). EFGE_ELNO.", status: machine}
- {fr: REAC,  en: reaction,           kind: abbrev, note: "réaction. REAC_NODA = nodal reactions.", status: machine}
- {fr: FORC,  en: force,              kind: abbrev, note: "FORC_NODA = nodal forces (internal, = assembled element forces).", status: machine}
- {fr: ELGA,  en: at Gauss points,    kind: abbrev, note: "élément, points de Gauss. Field location.", aliases_en: [at integration points], status: machine}
- {fr: ELNO,  en: at element nodes,   kind: abbrev, note: "élément, noeuds: extrapolated to nodes, not averaged between elements.", status: machine}
- {fr: NOEU,  en: at nodes (averaged), kind: abbrev, note: "noeuds: nodal field averaged across adjoining elements.", status: machine}
- {fr: MECA,  en: mechanical,         kind: abbrev, note: "mécanique.", status: machine}
- {fr: THER,  en: thermal,            kind: abbrev, note: "thermique.", asterstudy: "Thermic", status: machine}
- {fr: RESU,  en: result,             kind: abbrev, note: "résultat. IMPR_RESU, TEST_RESU, RESULTAT keyword.", asterstudy: "Results", status: machine}
- {fr: IMPR,  en: write (print),      kind: abbrev, note: "imprimer: write to file. IMPR_RESU, IMPR_TABLE.", aliases_en: [impress], status: machine}
- {fr: LIRE,  en: read,               kind: abbrev, note: "lire. LIRE_MAILLAGE.", status: machine}
- {fr: DEFI,  en: define,             kind: abbrev, note: "définir. DEFI_MATERIAU, DEFI_FONCTION, DEFI_GROUP.", status: machine}
- {fr: AFFE,  en: assign,             kind: abbrev, note: "affecter. AFFE_MODELE, AFFE_MATERIAU, AFFE keyword block.", aliases_en: [affectation], asterstudy: "Assignement", status: machine}
- {fr: CALC,  en: compute,            kind: abbrev, note: "calculer. CALC_CHAMP, CALC_MODES.", status: machine}
- {fr: POST,  en: post-process,       kind: abbrev, note: "POST_RELEVE_T, POST_ELEM.", status: machine}
- {fr: CREA,  en: create,             kind: abbrev, note: "créer. CREA_CHAMP, CREA_MAILLAGE.", status: machine}
- {fr: MODI,  en: modify,             kind: abbrev, note: "modifier. MODI_MAILLAGE.", status: machine}
- {fr: ASSE,  en: assemble,           kind: abbrev, note: "assembler. ASSE_MATRICE, ASSEMBLAGE.", status: machine}
- {fr: NUME,  en: numbering,          kind: abbrev, note: "numérotation. NUME_DDL = DOF numbering; NUME_ORDRE = result step index.", status: machine}
- {fr: MACR,  en: macro,              kind: abbrev, note: "MACR_LIGN_COUPE etc.: macro-commands built from others.", status: machine}

# ---------- core concepts ----------
- {fr: maillage,        en: mesh,                 kind: term, note: "The geometric discretization: nodes, elements and their groups (result of LIRE_MAILLAGE). Not the model: see modèle.", status: machine}
- {fr: maille,          en: element,              kind: term, note: "Mesh element in French usage (MA in keyword names). Always 'element' in English, never 'cell'.", aliases_en: [cell], status: machine}
- {fr: noeud,           en: node,                 kind: term, note: "Mesh node (NO in keyword names). Never 'vertex'.", aliases_en: [vertex], status: machine}
- {fr: modèle,          en: model,                kind: term, note: "The mesh + element formulation assignment (result of AFFE_MODELE).", status: machine}
- {fr: modélisation,    en: modeling type,        kind: term, note: "Element formulation family: 3D, DKT, AXIS… Not 'modelization'.", aliases_en: [modelization, modelisation], status: machine}
- {fr: phénomène,       en: physics,              kind: term, note: "PHENOMENE = 'MECANIQUE' | 'THERMIQUE' | 'ACOUSTIQUE'.", aliases_en: [phenomenon], status: machine}
- {fr: concept,         en: result object,        kind: term, note: "A named object produced by a command (mesh, model, field, result). Keep '(concept)' once at first use in docs.", status: machine}
- {fr: structure de données (SD), en: data structure, kind: term, note: "Internal storage of a concept. Rarely user-facing.", status: machine}
- {fr: matériau,        en: material,             kind: term, note: "A set of material parameters (DEFI_MATERIAU); placed on the mesh by AFFE_MATERIAU.", status: machine}
- {fr: champ de matériau, en: material field,     kind: term, note: "CHAM_MATER: which material applies where (result of AFFE_MATERIAU).", status: machine}
- {fr: chargement,      en: load,                 kind: term, note: "Loads and boundary conditions together; a char_meca object can hold both. Never 'charge' in English.", aliases_en: [charge], status: machine}
- {fr: cas de charge,   en: load case,            kind: term, note: "One combination of loads solved together (one EXCIT list in MECA_STATIQUE).", status: machine}
- {fr: conditions aux limites, en: boundary conditions, kind: term, note: "Imposed displacements, symmetries and couplings (DDL_IMPO, LIAISON_*). Abbreviated BCs in short labels.", status: machine}
- {fr: dualisation,     en: Lagrange-multiplier enforcement, kind: term, note: "BCs applied via Lagrange multipliers (AFFE_CHAR_MECA) vs eliminated (AFFE_CHAR_CINE).", aliases_en: [dualization], status: machine}
- {fr: degré de liberté (DDL), en: degree of freedom (DOF), kind: term, note: "DDL in keyword names (DDL_IMPO, NUME_DDL, LIAISON_DDL). Components DX, DY, DZ, DRX, DRY, DRZ, TEMP...", status: machine}
- {fr: unité logique,   en: logical unit,         kind: term, note: "Numbered file slot (UNITE=20) mapped to a file in the .export.", status: machine}
- {fr: fichier de commandes, en: command file,    kind: term, note: ".comm file.", status: machine}
- {fr: fichier .mess,   en: log file,             kind: term, note: "Solver message log.", status: machine}
- {fr: alarme,          en: warning,              kind: term, note: "<A> in the log. Never 'alarm'.", aliases_en: [alarm], status: machine}
- {fr: erreur fatale,   en: fatal error,          kind: term, note: "<F>.", status: machine}
- {fr: erreur,          en: error,                kind: term, note: "<E>.", status: machine}
- {fr: instant,         en: time step,            kind: term, note: "INST: pseudo-time / load-step parameter of a result.", aliases_en: [time instant], status: machine}
- {fr: numéro d'ordre,  en: step index,           kind: term, note: "NUME_ORDRE.", status: machine}
- {fr: groupe de mailles, en: element group,      kind: term, note: "Named set of elements (GROUP_MA), usually defined in the mesher or with DEFI_GROUP.", aliases_en: [cell group, mesh group], status: machine}
- {fr: groupe de noeuds, en: node group,          kind: term, note: "Named set of nodes (GROUP_NO), usually defined in the mesher or with DEFI_GROUP.", status: machine}
- {fr: peau,            en: boundary (skin) elements, kind: term, note: "ORIE_PEAU: orient 2D boundary elements of a 3D mesh outward.", status: machine}
- {fr: coque,           en: shell,                kind: term, note: "Shell elements (modeling types DKT, DST, COQUE_3D...); properties set in AFFE_CARA_ELEM COQUE.", status: machine}
- {fr: plaque,          en: plate,                kind: term, note: "Flat plate: a shell with no curvature. code_aster uses the same shell modeling types (DKT, DST).", status: machine}
- {fr: poutre,          en: beam,                 kind: term, note: "Beam elements (POU_D_T, POU_D_E); section properties set in AFFE_CARA_ELEM POUTRE.", status: machine}
- {fr: épaisseur,       en: thickness,            kind: term, note: "Shell or membrane thickness (EPAIS in AFFE_CARA_ELEM).", status: machine}
- {fr: couche,          en: layer,                kind: term, note: "COQUE_NCOU: number of through-thickness layers for stress recovery.", status: machine}
- {fr: raideur,         en: stiffness,            kind: term, note: "Stiffness: of a structure, of a discrete spring (DISCRET K_*), or the assembled matrix (RIGI_MECA).", status: machine}
- {fr: rigidité,        en: stiffness,            kind: term, note: "RIGI_MECA = stiffness matrix.", status: machine}
- {fr: masse,           en: mass,                 kind: term, note: "MASS_MECA = mass matrix; MASS_INER = mass/inertia properties.", status: machine}
- {fr: fréquence propre, en: natural frequency,   kind: term, note: "Eigenfrequency in Hz from CALC_MODES (FREQ parameter of a mode_meca result).", status: machine}
- {fr: mode propre,     en: mode shape,           kind: term, note: "Eigenvector of the modal problem; stored as the DEPL field of each step of a mode_meca result.", status: machine}
- {fr: masse effective, en: effective mass,       kind: term, note: "MASS_EFFE: modal effective mass; MASS_EFFE_UN = unit-normalised fraction.", status: machine}
- {fr: résultante,      en: resultant,            kind: term, note: "Integrated force or moment over a section or group (e.g. POST_RELEVE_T RESULTANTE, MOMENT).", status: machine}
- {fr: contrainte équivalente de von Mises, en: von Mises stress, kind: term, note: "VMIS component of SIEQ_* fields.", status: machine}
- {fr: contrainte principale, en: principal stress, kind: term, note: "PRIN_1, PRIN_2, PRIN_3 components of SIEQ_* fields.", status: machine}
- {fr: solveur,         en: solver,               kind: term, note: "SOLVEUR = linear solver settings (MUMPS, MULT_FRONT, PETSC).", status: machine}
- {fr: factorisation,   en: factorization,        kind: term, note: "Matrix factorization by the direct solvers (MUMPS, MULT_FRONT, LDLT); appears in solver diagnostics (singular or near-singular matrix).", status: machine}
- {fr: pivot nul,       en: zero pivot,           kind: term, note: "Singular matrix: usually missing BCs or unconnected parts.", status: machine}
- {fr: convergence,     en: convergence,          kind: term, note: "Of Newton iterations (STAT_NON_LINE) or of iterative solvers and eigensolvers. Same word in both languages.", status: machine}
- {fr: pas de temps,    en: time step,            kind: term, note: "Time increment between two instants of a time list (DEFI_LIST_INST, LIST_INST). The instant itself is INST.", status: machine}
- {fr: liaison,         en: constraint (coupling), kind: term, note: "LIAISON_* keywords: linear relations between DOFs (tie, rigid, RBE3).", aliases_en: [linkage, DOF link], status: machine}
- {fr: maître / esclave, en: main / secondary,     kind: term, note: "MAIT/ESCL in LIAISON_MAIL, contact. Use main/secondary consistently.", aliases_en: [master/slave], status: machine}
- {fr: repère,          en: coordinate system,    kind: term, note: "REPERE='GLOBAL'|'LOCAL'|'UTILISATEUR'.", aliases_en: [reference frame, frame of reference], status: machine}
- {fr: fonction,        en: function,             kind: term, note: "DEFI_FONCTION: tabulated function of a parameter (INST, X, Y, Z, TEMP).", status: machine}
- {fr: prolongement,    en: extrapolation (outside table range), kind: term, note: "PROL_DROITE/PROL_GAUCHE = right/left extension: 'CONSTANT', 'LINEAIRE', 'EXCLU'.", status: machine}

# ---------- commands (Tier 1/2) ----------
- {fr: DEBUT,            en: begin study,                      kind: command, note: "fr: 'Initialisation des ressources, démarrage ou reprise d'un calcul'. First command of every .comm file; LANG selects the message language.", status: machine}
- {fr: FIN,              en: end study,                        kind: command, note: "fr: 'Fin d'une étude, fin du travail engagé par une des commandes DEBUT ou POURSUITE'. Last command; closes the database.", status: machine}
- {fr: POURSUITE,        en: continue study (restart),         kind: command, note: "Restarts from a saved database instead of DEBUT. Has no catalog of its own: it reuses DEBUT's (docs/INVENTORY.md).", status: machine}
- {fr: LIRE_MAILLAGE,    en: read mesh,                        kind: command, note: "fr: 'Crée un maillage par lecture d'un fichier'. FORMAT 'MED' (default) | 'ASTER' | 'GMSH' | 'IDEAS' | 'GIBI'; UNITE = logical unit of the file.", status: machine}
- {fr: MODI_MAILLAGE,    en: modify mesh,                      kind: command, note: "fr: modify an existing mesh, e.g. reorient elements that carry a pressure or contact (ORIE_PEAU, ORIE_NORM_COQUE). Reentrant on MAILLAGE.", status: machine}
- {fr: DEFI_GROUP,       en: define groups,                    kind: command, note: "fr: 'Définition de nouveaux groupes de noeuds et/ou de mailles dans un concept maillage'. CREA_GROUP_MA / CREA_GROUP_NO; reentrant on MAILLAGE.", status: machine}
- {fr: CREA_MAILLAGE,    en: create derived mesh,              kind: command, note: "fr: 'Crée un maillage à partir d'un maillage existant' (e.g. LINE_QUAD, QUAD_LINE, COQU_VOLU). The input mesh is unchanged.", status: machine}
- {fr: AFFE_MODELE,      en: assign model,                     kind: command, note: "fr: 'Définir le phénomène physique modélisé et le type d'éléments finis sur le maillage'. Produces a model (modele_sdaster) from PHENOMENE + MODELISATION per group.", status: machine}
- {fr: DEFI_MATERIAU,    en: define material,                  kind: command, note: "fr: 'Définition des paramètres décrivant le comportement d'un matériau'. One factor keyword per law (ELAS, ELAS_FO, ...).", status: machine}
- {fr: AFFE_MATERIAU,    en: assign material,                  kind: command, note: "fr: 'Affecter des matériaux à des zones géométriques d'un maillage'. Produces a material field (cham_mater); AFFE_VARC adds state variables.", status: machine}
- {fr: AFFE_CARA_ELEM,   en: assign element properties,        kind: command, note: "fr: 'Affectation de caractéristiques à des éléments de structure'. Shell thickness (COQUE), beam sections (POUTRE), springs (DISCRET), solid orientation (MASSIF).", status: machine}
- {fr: AFFE_CHAR_MECA,   en: assign mechanical loads and BCs,  kind: command, note: "fr: 'Affectation de charges et conditions aux limites mécaniques constantes'. Loads and BCs with constant values; BCs are enforced by Lagrange multipliers.", status: machine}
- {fr: AFFE_CHAR_MECA_F, en: assign mechanical loads and BCs (function-valued), kind: command, note: "fr: same as AFFE_CHAR_MECA, with values given as functions of one or more parameters (space, time). Values are function objects (DEFI_FONCTION, FORMULE).", status: machine}
- {fr: AFFE_CHAR_CINE,   en: assign kinematic BCs,             kind: command, note: "fr: 'conditions aux limites cinématiques (U=U0) pour un traitement sans dualisation'. BCs eliminated from the system instead of Lagrange multipliers; imposed DOF only, no loads.", status: machine}
- {fr: AFFE_CHAR_THER,   en: assign thermal loads and BCs,     kind: command, note: "fr: 'Affectation de charges et conditions aux limites thermiques constantes'. TEMP_IMPO, FLUX_REP, ECHANGE, SOURCE.", status: machine}
- {fr: DEFI_FONCTION,    en: define function,                  kind: command, note: "fr: 'Définit une fonction réelle ou complexe d'une variable réelle'. Tabulated: NOM_PARA + VALE pairs, with INTERPOL and PROL_GAUCHE/PROL_DROITE.", status: machine}
- {fr: DEFI_CONSTANTE,   en: define constant function,         kind: command, note: "fr: 'Définir la valeur d'une grandeur invariante'. A function object that returns the same value for any parameter.", status: machine}
- {fr: DEFI_LIST_REEL,   en: define real list,                 kind: command, note: "fr: 'Définir une liste de réels strictement croissante'. Often the list of instants for INCREMENT or LIST_INST.", status: machine}
- {fr: DEFI_LIST_INST,   en: define time-step list,            kind: command, note: "fr: 'Définition de la gestion de la liste d'instants'. METHODE 'MANUEL' (default) | 'AUTO'; ECHEC sets what happens when a step fails (e.g. step cutting).", status: machine}
- {fr: MECA_STATIQUE,    en: linear static analysis,           kind: command, note: "fr: 'Résoudre un problème de mécanique statique linéaire'. Produces an evol_elas result.", status: machine}
- {fr: STAT_NON_LINE,    en: nonlinear static analysis,        kind: command, note: "fr: quasi-static nonlinear evolution (mechanical or coupled thermo-hydro-mechanical). Produces an evol_noli result.", status: machine}
- {fr: THER_LINEAIRE,    en: linear thermal analysis,          kind: command, note: "fr: 'Résoudre un problème thermique linéaire stationnaire ou transitoire'. Produces an evol_ther result.", status: machine}
- {fr: CALC_CHAMP,       en: compute derived fields,           kind: command, note: "fr: 'Compléter ou créer un résultat en calculant des champs par éléments ou aux noeuds'. Adds SIGM_*, SIEQ_*, EPSI_*, REAC_NODA, ... to a result.", status: machine}
- {fr: CALC_MODES,       en: compute natural modes,            kind: command, note: "fr: 'Calculer les modes propres ou de flambement d'une structure'. Natural modes (TYPE_RESU 'DYNAMIQUE', default) or buckling modes ('MODE_FLAMB').", status: machine}
- {fr: NORM_MODE,        en: normalize modes,                  kind: command, note: "fr: 'Normer des modes propres en fonction d'un critère choisi par l'utilisateur' (NORME). Reentrant on MODE.", status: machine}
- {fr: EXTR_MODE,        en: extract/filter modes,             kind: command, note: "fr: 'Extraire sélectivement des modes des structures de données modales'. FILTRE_MODE with CRIT_EXTR and SEUIL.", status: machine}
- {fr: ASSEMBLAGE,       en: assemble matrices and vectors,    kind: command, note: "fr: 'Calcul des matrices et vecteurs assemblés'. One-step form of CALC_MATR_ELEM + NUME_DDL + ASSE_MATRICE.", status: machine}
- {fr: POST_RELEVE_T,    en: extract values to table,          kind: command, note: "fr: extract field component values for calculations (mean, invariants, ...) or to express them in other coordinate systems. Output is a table.", status: machine}
- {fr: POST_ELEM,        en: element-based post-processing,    kind: command, note: "fr: 'Calcul de quantités globales (masse, inerties, énergie, ...) sur tout ou partie du modèle'. Output is a table.", status: machine}
- {fr: POST_RCCM,        en: stress linearization (RCC-M),     kind: command, note: "fr: checks the RCC-M level 0 criteria and some level A criteria (French nuclear design code). Stress linearization is one of its options.", status: machine}
- {fr: MACR_LIGN_COUPE,  en: extract along cut line,           kind: command, note: "fr: extract result values into tables along cut lines defined by two points and a number of intervals (LIGN_COUPE).", status: machine}
- {fr: CREA_CHAMP,       en: create field,                     kind: command, note: "fr: 'Création d'un champ'. OPERATION selects how: 'AFFE' (assign values), 'EXTR' (extract from a result), 'ASSE', 'COMB', 'EVAL', ...", status: machine}
- {fr: IMPR_RESU,        en: write results,                    kind: command, note: "fr: write a mesh and/or computed results to a file (several formats). FORMAT 'MED' (default) | 'RESULTAT' | 'ASTER' | 'GMSH' | 'IDEAS'.", status: machine}
- {fr: IMPR_TABLE,       en: write table,                      kind: command, note: "fr: 'Impression du contenu d'une table dans un fichier'.", status: machine}
- {fr: TEST_RESU,        en: test result value,                kind: command, note: "fr: extract a value from a data structure and compare it with a reference value. Used by test cases for regression (VALE_CALC) and validation (VALE_REFE).", status: machine}
- {fr: DEFI_CONTACT,     en: define contact,                   kind: command, note: "fr: defines zones under unilateral contact conditions, with or without friction. Produces a char_contact passed to STAT_NON_LINE.", status: machine}

# ---------- keywords (most frequent) ----------
- {fr: MAILLAGE,      en: mesh,                      kind: keyword, note: "Keyword taking a mesh object (maillage_sdaster). Same word as the concept maillage.", asterstudy: "Mesh", status: machine}
- {fr: MODELE,        en: model,                     kind: keyword, note: "Keyword taking a model object (result of AFFE_MODELE).", asterstudy: "Model", status: machine}
- {fr: MATER,         en: material,                  kind: keyword, note: "Keyword taking a material object (result of DEFI_MATERIAU), e.g. in AFFE_MATERIAU AFFE.", asterstudy: "Material", status: machine}
- {fr: CHAM_MATER,    en: material field,            kind: keyword, note: "Keyword taking a material field (result of AFFE_MATERIAU). fr: required unless the model only has discrete elements (DIS_*).", asterstudy: "Material field", status: machine}
- {fr: CARA_ELEM,     en: element properties,        kind: keyword, note: "Keyword taking an element-properties object (result of AFFE_CARA_ELEM). fr: required as soon as the model contains structural elements (shells, beams, ...).", asterstudy: "Structural element characteristic", status: machine}
- {fr: CHARGE,        en: load,                      kind: keyword, note: "Keyword taking a load object (AFFE_CHAR_MECA, AFFE_CHAR_CINE, ...), usually inside EXCIT.", asterstudy: "Load", status: machine}
- {fr: EXCIT,         en: applied loads,             kind: keyword, note: "List of (CHARGE, FONC_MULT) pairs in a solve command.", aliases_en: [excitation list], asterstudy: "Loads", status: machine}
- {fr: FONC_MULT,     en: load multiplier function,  kind: keyword, note: "Function of time (or parameter) that multiplies a load in EXCIT. Elsewhere it multiplies other quantities, e.g. a mass in AFFE_CARA_ELEM.", asterstudy: "Multiplier function", status: machine}
- {fr: RESULTAT,      en: result,                    kind: keyword, note: "Keyword taking a result object (evol_elas, mode_meca, ...) to post-process or update.", asterstudy: "Result", status: machine}
- {fr: NOM_CHAM,      en: field name,                kind: keyword, note: "Name of a field in a result: 'DEPL', 'SIGM_NOEU', 'REAC_NODA', ...", status: machine}
- {fr: NOM_CMP,       en: component name,            kind: keyword, note: "Name of a field component: 'DX', 'SIXX', 'VMIS', ...", status: machine}
- {fr: TOUT,          en: all (entire mesh),         kind: keyword, note: "TOUT='OUI' applies the keyword to the whole mesh (or to all of its items); usually exclusive with GROUP_MA / GROUP_NO.", asterstudy: "All", status: machine}
- {fr: GROUP_MA,      en: element group,             kind: keyword, note: "List of element group names. MA = maille = element.", aliases_en: [cell group], asterstudy: "Group of element", status: machine}
- {fr: GROUP_NO,      en: node group,                kind: keyword, note: "List of node group names. NO = noeud = node.", asterstudy: "Group of node", status: machine}
- {fr: PHENOMENE,     en: physics,                   kind: keyword, note: "AFFE_MODELE: 'MECANIQUE' | 'THERMIQUE' | 'ACOUSTIQUE'.", asterstudy: "Phenomenon", status: machine}
- {fr: MODELISATION,  en: modeling type,             kind: keyword, note: "AFFE_MODELE: element formulation per group ('3D', 'DKT', 'POU_D_T', ...). Never 'modelization'.", asterstudy: "Modelisation", status: machine}
- {fr: EPAIS,         en: thickness,                 kind: keyword, note: "AFFE_CARA_ELEM COQUE: shell thickness. Also membrane thickness (MEMBRANE, nonlinear use only) and composite layer thickness (DEFI_COMPOSITE).", status: machine}
- {fr: COQUE_NCOU,    en: number of shell layers,    kind: keyword, note: "AFFE_CARA_ELEM COQUE: number of through-thickness layers for integration and stress output (default 1).", status: machine}
- {fr: ANGL_REP,      en: local-axis angles,         kind: keyword, note: "AFFE_CARA_ELEM: angles that set a local axis: 2 values for COQUE (shell reference direction), 1 in 2D or 3 in 3D for MASSIF.", status: machine}
- {fr: VECTEUR,       en: reference vector (local x), kind: keyword, note: "AFFE_CARA_ELEM COQUE: vector whose projection on the shell sets the local x axis (alternative to ANGL_REP).", status: machine}
- {fr: DDL_IMPO,      en: imposed DOF,               kind: keyword, note: "AFFE_CHAR_MECA: imposes values of DOFs (DX, DY, DZ, DRX...) on nodes or groups; enforced by Lagrange multipliers.", asterstudy: "Enforce DOF", status: machine}
- {fr: MECA_IMPO,     en: imposed DOF (kinematic),   kind: keyword, note: "AFFE_CHAR_CINE: imposed mechanical DOFs, eliminated from the system (no Lagrange multipliers).", status: machine}
- {fr: FACE_IMPO,     en: imposed DOF on faces,      kind: keyword, note: "AFFE_CHAR_MECA: imposes DOF values on all nodes of a face; also accepts DNOR (normal displacement).", status: machine}
- {fr: PRES_REP,      en: distributed pressure,      kind: keyword, note: "Pression répartie. Positive = pushing on the face (requires outward normals).", status: machine}
- {fr: FORCE_FACE,    en: force per unit area on faces, kind: keyword, note: "AFFE_CHAR_MECA: surface force (FX, FY, FZ per unit area) on faces of solid elements.", status: machine}
- {fr: FORCE_ARETE,   en: force per unit length on edges, kind: keyword, note: "AFFE_CHAR_MECA: force per unit length on edges of solid or shell elements.", status: machine}
- {fr: FORCE_NODALE,  en: nodal force,               kind: keyword, note: "AFFE_CHAR_MECA: concentrated forces and moments on nodes (FX..FZ, MX..MZ).", status: machine}
- {fr: PESANTEUR,     en: gravity,                   kind: keyword, note: "AFFE_CHAR_MECA: gravity field: GRAVITE (acceleration magnitude) and DIRECTION. Mass comes from RHO.", asterstudy: "Gravitational acceleration", status: machine}
- {fr: ROTATION,      en: rotation (centrifugal load), kind: keyword, note: "AFFE_CHAR_MECA: rotation load (centrifugal), VITESSE about AXE through CENTRE. In MODI_MAILLAGE, ROTATION rotates the mesh instead.", asterstudy: "Rotation", status: machine}
- {fr: LIAISON_DDL,   en: linear DOF relation,       kind: keyword, note: "AFFE_CHAR_MECA: linear relation sum(COEF_MULT * DOF) = COEF_IMPO between DOFs of two or more nodes.", status: machine}
- {fr: LIAISON_UNIF,  en: uniform DOF coupling,      kind: keyword, note: "AFFE_CHAR_MECA: imposes the same (unknown) value on a DOF over a set of nodes.", status: machine}
- {fr: LIAISON_SOLIDE, en: rigid-body coupling,      kind: keyword, note: "AFFE_CHAR_MECA: makes a part of the structure rigid (undeformable).", status: machine}
- {fr: LIAISON_MAIL,  en: mesh tie (bonded),         kind: keyword, note: "AFFE_CHAR_MECA: fr: linear relations that join two boundaries of a structure ('recoller deux bords'). GROUP_MA_MAIT / GROUP_MA_ESCL, TYPE_RACCORD.", status: machine}
- {fr: LIAISON_RBE3,  en: RBE3 distributed coupling, kind: keyword, note: "AFFE_CHAR_MECA: RBE3-type relations between a main node and secondary nodes: load spread without adding stiffness.", status: machine}
- {fr: ORIE_PEAU,     en: orient boundary elements outward, kind: keyword, note: "MODI_MAILLAGE: orients boundary (skin) elements of GROUP_MA_PEAU outward from the volume, so that pressure acts with a consistent sign.", status: machine}
- {fr: ORIE_NORM_COQUE, en: orient shell normals,    kind: keyword, note: "MODI_MAILLAGE: makes shell normals of GROUP_MA consistent, optionally along VECT_NORM.", status: machine}
- {fr: SOLVEUR,       en: linear solver,             kind: keyword, note: "Factor keyword of analysis commands: linear solver settings. METHODE 'MUMPS' | 'MULT_FRONT' | 'LDLT' | 'GCPC' | 'PETSC'.", asterstudy: "Solver", status: machine}
- {fr: METHODE,       en: method,                    kind: keyword, note: "Generic: method choice, values depend on the enclosing keyword (SOLVEUR, CALC_MODES, DEFI_LIST_INST ...).", asterstudy: "Method", status: machine}
- {fr: OPTION,        en: option,                    kind: keyword, note: "Generic: computation option, values depend on the command (e.g. CALC_MODES search range, ASSEMBLAGE matrix type).", asterstudy: "Option", status: machine}
- {fr: CONTRAINTE,    en: stress fields,             kind: keyword, note: "In CALC_CHAMP: which stress fields to derive.", status: machine}
- {fr: CRITERES,      en: equivalent-stress fields,  kind: keyword, note: "In CALC_CHAMP: SIEQ_* (von Mises, Tresca, principals).", aliases_en: [criteria fields], status: machine}
- {fr: DEFORMATION,   en: strain fields,             kind: keyword, note: "CALC_CHAMP: strain options (EPSI_*, EPME_*, ...). In COMPORTEMENT it is the strain measure ('PETIT' = small strain, default).", status: machine}
- {fr: FORCE,         en: force fields,              kind: keyword, note: "In CALC_CHAMP: REAC_NODA, FORC_NODA.", status: machine}
- {fr: ENERGIE,       en: energy fields,             kind: keyword, note: "CALC_CHAMP: energy options (ENEL_* elastic energy, DISS_* dissipated, ...).", status: machine}
- {fr: INTITULE,      en: label,                     kind: keyword, note: "Free-text label, e.g. one per ACTION in POST_RELEVE_T (required there); it fills the table's INTITULE column.", status: machine}
- {fr: OPERATION,     en: operation,                 kind: keyword, note: "Generic: what the command does with the data, e.g. CREA_CHAMP 'AFFE' | 'EXTR' | ...; POST_RELEVE_T 'EXTRACTION' | 'MOYENNE' | ...", status: machine}
- {fr: RESULTANTE,    en: resultant components,      kind: keyword, note: "POST_RELEVE_T ACTION: components to integrate into a resultant (e.g. 'DX', 'DY', 'DZ').", status: machine}
- {fr: MOMENT,        en: moment components,         kind: keyword, note: "POST_RELEVE_T ACTION: components whose moment about POINT is computed (with RESULTANTE).", status: machine}
- {fr: POINT,         en: reference point,           kind: keyword, note: "Point coordinates; in POST_RELEVE_T, the point about which MOMENT is computed.", status: machine}
- {fr: UNITE,         en: logical unit,              kind: keyword, note: "Logical unit (file slot) number mapped to a file in the .export (fort.N). AsterStudy shows it as a file name.", aliases_en: [unit number], asterstudy: "Filename", status: machine}
- {fr: FORMAT,        en: file format,               kind: keyword, note: "File format; values depend on the command (LIRE_MAILLAGE / IMPR_RESU: 'MED' default; IMPR_TABLE: 'TABLEAU' default).", asterstudy: "Format", status: machine}
- {fr: INFO,          en: verbosity,                 kind: keyword, note: "Verbosity of the command's output in the log: 1 (default for most commands) or 2 (more detail); some commands accept up to 4.", asterstudy: "Verbosity", status: machine}
- {fr: TITRE,         en: title,                     kind: keyword, note: "Title text attached to the object produced (table, load, graph).", asterstudy: "Title", status: machine}
- {fr: VALE,          en: value(s),                  kind: keyword, note: "Generic: list of values; meaning set by the command (function points in DEFI_FONCTION, coordinates, angles...).", asterstudy: "Value", status: machine}
- {fr: VALE_CALC,     en: computed value (regression), kind: keyword, note: "TEST_RESU / TEST_TABLE: value computed by the code, used for non-regression (compared with TOLE_MACHINE, default 1e-6).", status: machine}
- {fr: VALE_REFE,     en: reference value,           kind: keyword, note: "TEST_RESU / TEST_TABLE: independent reference value (analytical, other code...), compared with PRECISION.", status: machine}
- {fr: PRECISION,     en: tolerance,                 kind: keyword, note: "Generic tolerance, relative or absolute per CRITERE ('RELATIF' default). In TEST_RESU, tolerance on VALE_REFE (default 0.001); elsewhere, tolerance to match an instant or a frequency.", asterstudy: "Precision", status: machine}
- {fr: REFERENCE,     en: reference type,            kind: keyword, note: "'ANALYTIQUE' | 'SOURCE_EXTERNE' | 'NON_DEFINI' | 'AUTRE_ASTER'.", status: machine}
- {fr: NOM_PARA,      en: parameter name,            kind: keyword, note: "Name of the parameter (abscissa) of a function ('INST', 'X', 'TEMP', ...) or of a table column.", asterstudy: "Parameter name", status: machine}
- {fr: PROL_DROITE,   en: right extrapolation,       kind: keyword, note: "DEFI_FONCTION: behavior beyond the last abscissa: 'EXCLU' (default, error) | 'CONSTANT' | 'LINEAIRE'.", asterstudy: "Right extension", status: machine}
- {fr: PROL_GAUCHE,   en: left extrapolation,        kind: keyword, note: "DEFI_FONCTION: behavior before the first abscissa: 'EXCLU' (default, error) | 'CONSTANT' | 'LINEAIRE'.", asterstudy: "Left extension", status: machine}
- {fr: INTERPOL,      en: interpolation,             kind: keyword, note: "DEFI_FONCTION: interpolation of abscissas and ordinates: 'LIN' (default) | 'LOG'. Some other commands also accept 'NON'.", asterstudy: "Interpolation", status: machine}
- {fr: CALC_FREQ,     en: frequency search settings, kind: keyword, note: "CALC_MODES: frequency search settings, content depends on OPTION (NMAX_FREQ for 'PLUS_PETITE', FREQ for 'CENTRE' or 'BANDE', ...).", status: machine}
- {fr: NMAX_FREQ,     en: number of frequencies,     kind: keyword, note: "CALC_MODES CALC_FREQ: number of eigenfrequencies to compute.", status: machine}
- {fr: FREQ,          en: frequency,                 kind: keyword, note: "Frequency in Hz; in CALC_FREQ, the center value ('CENTRE') or band limits ('BANDE').", status: machine}
- {fr: MATR_RIGI,     en: stiffness matrix,          kind: keyword, note: "Assembled stiffness matrix (e.g. CALC_MODES). In some nonlinear commands it is instead the matrix type: 'ELASTIQUE' | 'TANGENTE' | 'SECANTE'.", status: machine}
- {fr: MATR_MASS,     en: mass matrix,               kind: keyword, note: "Assembled mass matrix (e.g. CALC_MODES).", status: machine}
- {fr: NUME_DDL,      en: DOF numbering,             kind: keyword, note: "DOF numbering object (nume_ddl), shared by the matrices and vectors that are combined. fr: useful in dynamics to impose the numbering of nodal fields.", status: machine}
- {fr: INST,          en: time step (pseudo-time),   kind: keyword, note: "Value of the time parameter of a result step. In static analyses it is a pseudo-time (load parameter), not a physical time.", asterstudy: "Time", status: machine}
- {fr: NUME_ORDRE,    en: step index,                kind: keyword, note: "Index of a step stored in a result. Selects a step instead of INST.", status: machine}
- {fr: TYPE_CHAM,     en: field type,                kind: keyword, note: "Field type as '<location>_<quantity>_<R|C|F>', e.g. 'NOEU_DEPL_R' (CREA_CHAMP, LIRE_CHAMP).", status: machine}
- {fr: TYPE_RESU,     en: result type,               kind: keyword, note: "Type of result to produce, values per command: CALC_MODES 'DYNAMIQUE' | 'MODE_FLAMB' | 'GENERAL'; CREA_RESU 'EVOL_ELAS' | ...", status: machine}
- {fr: VERI_MAIL,     en: mesh checks,               kind: keyword, note: "LIRE_MAILLAGE: mesh checks on read: VERIF 'OUI' (default) | 'NON', and APLAT (default 0.001), the flatness threshold (ratio of shortest to longest node-to-node distance of an element; upstream bibfor/modelisa/chckma.F90).", status: machine}

