# ---------- result objects and field/component names (never renamed; labelled) ----------
- {fr: EVOL_ELAS,   en: linear static result,     kind: concept, note: "Result type evol_elas, produced by MECA_STATIQUE: one step per instant or load case.", status: machine}
- {fr: EVOL_NOLI,   en: nonlinear result,         kind: concept, note: "Result type evol_noli, produced by STAT_NON_LINE / DYNA_NON_LINE.", asterstudy: "Non linear transient", status: machine}
- {fr: EVOL_THER,   en: thermal result,           kind: concept, note: "Result type evol_ther, produced by THER_LINEAIRE / THER_NON_LINE.", status: machine}
- {fr: MODE_MECA,   en: modal result,             kind: concept, note: "Result type mode_meca, produced by CALC_MODES: one step per mode, with FREQ and modal masses as parameters.", status: machine}
- {fr: DEPL,        en: displacement,             kind: concept, note: "Components DX DY DZ DRX DRY DRZ.", status: machine}
- {fr: SIGM_ELNO,   en: stress at element nodes,  kind: concept, note: "Stress computed by CALC_CHAMP CONTRAINTE, at element nodes, not averaged: discontinuous between elements.", status: machine}
- {fr: SIGM_NOEU,   en: stress (nodal average),   kind: concept, note: "Stress averaged at nodes from SIGM_ELNO by CALC_CHAMP: smooth, but hides inter-element jumps.", status: machine}
- {fr: SIEF_ELGA,   en: stress at Gauss points,   kind: concept, note: "Stress field at Gauss points: the raw output of the solver (forces for beams, discretes). Starting point for other stress options.", status: machine}
- {fr: SIEQ_ELNO,   en: equivalent stress at element nodes, kind: concept, note: "Equivalent stresses (VMIS, TRESCA, PRIN_*, VMIS_SG...) at element nodes, from CALC_CHAMP CRITERES.", status: machine}
- {fr: SIEQ_NOEU,   en: equivalent stress (nodal average), kind: concept, note: "Equivalent stresses averaged at nodes, from CALC_CHAMP CRITERES.", status: machine}
- {fr: EPSI_ELNO,   en: strain at element nodes,  kind: concept, note: "Strain at element nodes, from CALC_CHAMP DEFORMATION.", status: machine}
- {fr: EPSI_NOEU,   en: strain (nodal average),   kind: concept, note: "Strain averaged at nodes, from CALC_CHAMP DEFORMATION.", status: machine}
- {fr: REAC_NODA,   en: nodal reactions,          kind: concept, note: "Nodal reactions, from CALC_CHAMP FORCE: FORC_NODA minus the applied loads (bibfor/calculel/ccfnrn.F90:715), so non-zero only where DOFs are imposed. The force the support exerts on the structure; components use the DOF names DX..DRZ (forces and moments).", status: machine}
- {fr: FORC_NODA,   en: nodal forces,             kind: concept, note: "Nodal forces, from CALC_CHAMP FORCE: element internal forces assembled at nodes. See REAC_NODA.", status: machine}
- {fr: EFGE_ELNO,   en: shell/beam resultants at element nodes, kind: concept, note: "Generalized forces at element nodes: shell resultants (NXX, MXX, QX...) or beam forces (N, VY, MT...). CALC_CHAMP CONTRAINTE.", status: machine}
- {fr: VMIS,        en: von Mises,                kind: concept, note: "SIEQ_* component: von Mises equivalent stress ('contrainte de Von Mises', catalo physical_quantities.py).", status: machine}
- {fr: TRESCA,      en: Tresca,                   kind: concept, note: "SIEQ_* component: Tresca equivalent stress.", status: machine}
- {fr: PRIN_1,      en: 1st principal,            kind: concept, note: "SIEQ_* / EPEQ_* component: the smallest principal value, signed (principal values are sorted in increasing order: PRIN_1 <= PRIN_2 <= PRIN_3; bibfor/algorith/fgequi.F90:170, bibfor/algeline/vpordo.F90:24). For stresses, the minimum (most compressive) principal stress.", status: machine}
- {fr: PRIN_2,      en: 2nd principal,            kind: concept, note: "SIEQ_* / EPEQ_* component: the intermediate principal value (see PRIN_1 for the order).", status: machine}
- {fr: PRIN_3,      en: 3rd principal,            kind: concept, note: "SIEQ_* / EPEQ_* component: the largest principal value, signed (see PRIN_1 for the order). For stresses, the maximum (most tensile) principal stress.", status: machine}
- {fr: VMIS_SG,     en: signed von Mises,         kind: concept, note: "SIEQ_* component: von Mises stress signed by the trace of sigma ('signée par la trace de sigma', catalo physical_quantities.py:3185). Default equivalent quantity in CALC_FATIGUE.", status: machine}
- {fr: SIXX,        en: normal stress XX,         kind: concept, note: "Stress component (SIGM_*, SIEF_*): normal stress in X.", status: machine}
- {fr: SIXY,        en: shear stress XY,          kind: concept, note: "Stress component (SIGM_*, SIEF_*): shear stress in the XY plane.", status: machine}
- {fr: MASS_INER,   en: mass and inertia properties, kind: concept, note: "POST_ELEM option: mass, center of gravity and inertia tensor of the whole model or of groups (ORIG_INER sets the inertia origin).", status: machine}
- {fr: MASS_EFFE_UN, en: effective mass fraction, kind: concept, note: "Modal table parameters MASS_EFFE_UN_DX/DY/DZ: effective modal mass divided by total mass in that direction ('masse effective unitaire'; MacroCommands/Modal/post_mode_ops.py).", status: machine}

