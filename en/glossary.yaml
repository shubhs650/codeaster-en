- {fr: TEMP_DEF_ALPHA, en: definition temperature of ALPHA, kind: keyword, note: "DEFI_MATERIAU ELAS_FO: temperature from which the mean expansion coefficient ALPHA(T) is measured; re-based on AFFE_VARC VALE_REF by the solver (bibfor/mate_util/alfint.F90).", source: "code_aster/Cata/Commands/defi_materiau.py:432", status: proposed}
- {fr: A_CIS, en: transverse shear correction factor, kind: keyword, note: "AFFE_CARA_ELEM COQUE: shear correction coefficient, default 5/6; read by COQUE_3D elements (bibfor/elements/vdesga.F90).", source: "code_aster/Cata/Commands/affe_cara_elem.py:783", status: proposed}
- {fr: COEF_RIGI_DRZ, en: drilling stiffness coefficient, kind: keyword, note: "AFFE_CARA_ELEM COQUE: fictitious stiffness on the rotation about the shell normal (DRZ), as a fraction of the smallest bending rotation stiffness (bibfor/elements/dxtloc.F90); negative = drilling formulation.", source: "code_aster/Cata/Commands/affe_cara_elem.py:784", status: proposed}
- {fr: EXCENTREMENT, en: shell offset, kind: keyword, note: "AFFE_CARA_ELEM COQUE: distance along the normal from the mesh surface to the shell mid-surface; sets INER_ROTA='OUI' (bibfor/modelisa/aceaco.F90).", source: "code_aster/Cata/Commands/affe_cara_elem.py:786", status: proposed}
- {fr: VERI_JACOBIEN, en: Jacobian check, kind: keyword, note: "AFFE_MODELE: 'OUI' (default) warns (MAILLAGE1_1) for each element whose Jacobian changes sign (distorted element). Catalog translation 'Jacobian check'.", source: "code_aster/Cata/Commands/affe_modele.py:371", status: proposed}
- {fr: VERI_AFFE, en: assignment check, kind: keyword, note: "AFFE_CHAR_MECA: 'OUI' (default) warns (CALCULEL_40) when a load is assigned to elements that cannot carry it (bibfor/calculel/verif_affe_carte.F90).", source: "code_aster/Cata/Commands/affe_char_meca.py:106", status: proposed}
- {fr: VERI_NORM, en: normal check, kind: keyword, note: "AFFE_CHAR_MECA: 'OUI' (default) checks that faces under PRES_REP, FACE_IMPO and EFFE_FOND have outward normals and stops otherwise (bibfor/modelisa/chveno.F90).", source: "code_aster/Cata/Commands/affe_char_meca.py:107", status: proposed}
- {fr: DOUBLE_LAGRANGE, en: double Lagrange multipliers, kind: keyword, note: "AFFE_CHAR_MECA: 'OUI' (default) dualizes each condition with two Lagrange multipliers, 'NON' with one (bibfor/load/charme.F90).", source: "code_aster/Cata/Commands/affe_char_meca.py:115", status: proposed}
- {fr: BLOCAGE, en: DOF family lock, kind: keyword, note: "DDL_IMPO: sets a whole family of DOFs to zero ('DEPLACEMENT', 'ROTATION', 'TUYAU_FOURIER') on each node that carries it (bibfor/load/caddli.F90).", source: "code_aster/Cata/Commands/affe_char_meca.py:262", status: proposed}
- {fr: COEF_MULT, en: multiplying coefficients, kind: keyword, note: "LIAISON_DDL and similar: the coefficient of each term of a linear relation, one per DOF; other commands use it for a single multiplier.", source: "code_aster/Cata/Commands/affe_char_meca.py:505", status: proposed}
- {fr: COEF_IMPO, en: imposed value, kind: keyword, note: "LIAISON_DDL and similar: the right-hand side of a linear relation (sum of coefficient x DOF = COEF_IMPO).", source: "code_aster/Cata/Commands/affe_char_meca.py:470", status: proposed}
- {fr: DISTANCE_MAX, en: maximum distance, kind: keyword, note: "Cut-off distance. LIAISON_MAIL: secondary nodes farther than this from every main element are not tied.", source: "code_aster/Cata/Commands/affe_char_meca.py:567", status: proposed}
- {fr: DIST_MIN, en: minimum distance, kind: keyword, note: "LIAISON_SOLIDE: distance below which nodes count as coincident when the solver classifies the node cloud; default 1e-3 x shortest edge (bibfor/load/caliso.F90).", source: "code_aster/Cata/Commands/affe_char_meca.py:680", status: proposed}
- {fr: ELIM_MULT, en: skip already tied nodes, kind: keyword, note: "LIAISON_MAIL: 'OUI' (default) does not tie again a node tied by an earlier occurrence (bibfor/load/LoadKinematic_module.F90 kineLoadElimMult).", source: "code_aster/Cata/Commands/affe_char_meca.py:628", status: proposed}
- {fr: EVOL_IMPO, en: imposed result, kind: keyword, note: "AFFE_CHAR_CINE: a result whose fields are imposed as the DOF values at each time step.", source: "code_aster/Cata/Commands/affe_char_cine.py:248", status: proposed}
- {fr: VALE_PARA, en: parameter values, kind: keyword, note: "DEFI_FONCTION: list of x values given separately from VALE_FONC (same length).", source: "code_aster/Cata/Commands/defi_fonction.py:72", status: proposed}
- {fr: VALE_FONC, en: function values, kind: keyword, note: "DEFI_FONCTION: list of y values given separately from VALE_PARA (same length).", source: "code_aster/Cata/Commands/defi_fonction.py:78", status: proposed}
- {fr: NOEUD_PARA, en: parameter nodes, kind: keyword, note: "DEFI_FONCTION: a list of nodes whose curvilinear abscissa along the line they form is the x value; VALE_Y gives the y values (bibfor/utilitai/op0003.F90).", source: "code_aster/Cata/Commands/defi_fonction.py:86", status: proposed}
- {fr: CISA_2D, en: in-plane shear, kind: keyword, note: "PRES_REP: shear stress along the edge of a 2D model. TODO(verify) sign convention against U4.44.01.", source: "code_aster/Cata/Commands/affe_char_meca.py:887", status: proposed}
# ---------- task 2.3d (solver and post-processing references) ----------
- {fr: TOUT_ORDRE, en: all steps, kind: keyword, note: "Select every stored step (storage index) of a result: CALC_CHAMP, POST_RELEVE_T, IMPR_RESU, POST_ELEM, CREA_CHAMP. Exclusive with NUME_ORDRE, INST, LIST_INST, ...", source: "code_aster/Cata/Commands/calc_champ.py:64", status: proposed}
- {fr: CHAM_UTIL, en: user-defined field, kind: keyword, note: "CALC_CHAMP: a new field computed from an existing one with formulas (FORMULE), a predefined criterion (TRACE, VMIS, INVA_2) or a norm; stored as UTnn_<location>.", source: "code_aster/Cata/Commands/calc_champ.py:176", status: proposed}
- {fr: RENUM, en: renumbering, kind: keyword, note: "SOLVEUR: reordering of the unknowns before factorization to limit fill-in (MDA, RCMK, METIS, AMD, PARMETIS, ...); allowed values depend on METHODE.", source: "code_aster/Cata/Commons/c_solveur.py:211", status: proposed}
- {fr: NPREC, en: singularity threshold (digits), kind: keyword, note: "SOLVEUR (direct solvers): number of significant digits lost on a pivot beyond which the matrix is declared singular (default 8); a negative value disables the check with MUMPS (bibfor/algeline/tldlg3.F90).", source: "code_aster/Cata/Commons/c_solveur.py:224", status: proposed}
- {fr: ELIM_LAGR, en: Lagrange multiplier elimination, kind: keyword, note: "SOLVEUR: 'OUI' eliminates the Lagrange multipliers of dualized boundary conditions before solving; 'NON' keeps them; MUMPS also has 'LAGR2' (its default), which removes the second multiplier of each doubly dualized condition.", source: "code_aster/Cata/Commons/c_solveur.py:232", status: proposed}
- {fr: STOP_SINGULIER, en: stop on singular matrix, kind: keyword, note: "SOLVEUR (direct solvers): 'OUI' stops with an error when a pivot loses more than NPREC digits; 'NON' only warns, unless the factorization cannot finish (bibfor/algeline/tldlg3.F90).", source: "code_aster/Cata/Commons/c_solveur.py:251", status: proposed}
- {fr: PCENT_PIVOT, en: pivoting memory margin (%), kind: keyword, note: "SOLVEUR (MUMPS, and LDLT_SP/LDLT_DP preconditioners): extra memory, in percent, reserved for pivoting during factorization.", source: "code_aster/Cata/Commons/c_solveur.py:295", status: proposed}
# ---------- task 2.4 (modelisations guide) ----------
- {fr: POUTRE, en: beam section properties, kind: keyword, note: "AFFE_CARA_ELEM factor keyword: cross-section of POU_D_T / POU_D_E elements, by SECTION ('CERCLE', 'RECTANGLE', 'GENERALE', 'COUDE') with CARA/VALE lists (A, IY, IZ, JX, AY, AZ, ... for 'GENERALE'). Lower-case 'poutre' is the term 'beam'.", source: "code_aster/Cata/Commands/affe_cara_elem.py:511", status: proposed}
- {fr: FORCE_POUTRE, en: force per unit length on beams, kind: keyword, note: "AFFE_CHAR_MECA: distributed load on beam elements (catalog help 'Applique des forces linéiques sur des éléments de type poutre'); TYPE_CHARGE 'FORCE' (default) or 'VENT'.", source: "code_aster/Cata/Commands/affe_char_meca.py:975", status: proposed}
- {fr: FORCE_COQUE, en: force per unit area on shells, kind: keyword, note: "AFFE_CHAR_MECA: surface load on shell elements (DKT, DST, COQUE_3D); catalog help 'Applique des forces surfaciques sur des éléments de types coques'.", source: "code_aster/Cata/Commands/affe_char_meca.py:1061", status: proposed}
- {fr: FORCE_CONTOUR, en: force per unit length on 2D edges, kind: keyword, note: "AFFE_CHAR_MECA: line load on the boundary of a 2D model (C_PLAN, D_PLAN, AXIS, AXIS_FOURIER); catalog help.", source: "code_aster/Cata/Commands/affe_char_meca.py:845", status: proposed}
- {fr: LIAISON_ELEM, en: solid-shell-beam connection, kind: keyword, note: "AFFE_CHAR_MECA: kinematic connection between different modeling types so that rotations are transmitted: OPTION 'COQ_3D' (shell edge to solid), '3D_POU' (beam to solid), 'COQ_POU' (beam to shell), pipe variants.", source: "code_aster/Cata/Commands/affe_char_meca.py:682", status: proposed}

# ---------- task 2.5 (fields guide) ----------
# abbreviations
- {fr: ELEM, en: per element, kind: abbrev, note: "élément: field location with one value per element (EPOT_ELEM, ERME_ELEM).", source: "code_aster/Cata/Commons/c_nom_cham_into.py:244", status: proposed}
- {fr: NODA, en: nodal, kind: abbrev, note: "FORC_NODA, REAC_NODA: vectors assembled on the nodal DOFs (components are DOF names), not averaged element fields.", source: "code_aster/Cata/Commons/c_nom_cham_into.py:382", status: proposed}
- {fr: EPEQ, en: equivalent strain, kind: abbrev, note: "déformations équivalentes: INVA_2, principal strains, INVA_2SG. EPEQ_ELNO, EPEQ_NOEU.", source: "code_aster/Cata/Commons/c_nom_cham_into.py:288", status: proposed}
- {fr: DEGE, en: generalized strains, kind: abbrev, note: "déformations généralisées: shell membrane strains and curvatures, beam strains and curvatures. DEGE_ELNO.", source: "code_aster/Cata/Commons/c_nom_cham_into.py:122", status: proposed}
- {fr: SIPO, en: beam section stresses, kind: abbrev, note: "contraintes pour les éléments de poutre: stress in the section due to each beam force (SN, SVY, SVZ, SMT, SMFY, SMFZ). SIPO_ELNO.", source: "code_aster/Cata/Commons/c_nom_cham_into.py:103", status: proposed}
# fields
- {fr: SIGM_ELGA, en: stress at Gauss points (from SIGM), kind: concept, note: "Stress tensor at Gauss points, from CALC_CHAMP CONTRAINTE. Unlike SIEF_ELGA it never holds forces.", source: "code_aster/Cata/Commons/c_nom_cham_into.py:96", status: proposed}
- {fr: SIEF_NOEU, en: "stress (nodal average, from SIEF)", kind: concept, note: "SIEF_ELNO averaged at nodes; for beams and discrete elements it holds forces.", source: "code_aster/Cata/Commons/c_nom_cham_into.py:95", status: proposed}
- {fr: SIEQ_ELGA, en: equivalent stress at Gauss points, kind: concept, note: "Equivalent stresses (VMIS, TRESCA, PRIN_*, ...) at Gauss points, from CALC_CHAMP CRITERES.", source: "code_aster/Cata/Commons/c_nom_cham_into.py:319", status: proposed}
- {fr: EPSI_ELGA, en: strain at Gauss points, kind: concept, note: "Strain tensor at Gauss points, from CALC_CHAMP DEFORMATION. Shear components are tensor components (half the engineering shear strain).", source: "code_aster/Cata/Commons/c_nom_cham_into.py:184", status: proposed}
- {fr: EPEQ_ELNO, en: equivalent strain at element nodes, kind: concept, note: "Equivalent strains (INVA_2, PRIN_*, INVA_2SG) at element nodes, from CALC_CHAMP CRITERES.", source: "code_aster/Cata/Commons/c_nom_cham_into.py:288", status: proposed}
- {fr: EPEQ_NOEU, en: equivalent strain (nodal average), kind: concept, note: "Equivalent strains averaged at nodes, from CALC_CHAMP CRITERES.", source: "code_aster/Cata/Commons/c_nom_cham_into.py:292", status: proposed}
- {fr: EFGE_ELGA, en: shell/beam resultants at Gauss points, kind: concept, note: "Generalized forces at Gauss points, in the element local axes. CALC_CHAMP CONTRAINTE.", source: "code_aster/Cata/Commons/c_nom_cham_into.py:76", status: proposed}
- {fr: EFGE_NOEU, en: shell/beam resultants (nodal average), kind: concept, note: "EFGE_ELNO averaged at nodes (local axes; CALC_CHAMP warns UTILITAI_4 when neighboring local axes disagree).", source: "code_aster/Cata/Commons/c_nom_cham_into.py:85", status: proposed}
- {fr: DEGE_ELNO, en: shell/beam generalized strains at element nodes, kind: concept, note: "Shell EXX..GAY or beam EPXX, GAXY, GAXZ, GAT, KY, KZ at element nodes. CALC_CHAMP DEFORMATION.", source: "code_aster/Cata/Commons/c_nom_cham_into.py:122", status: proposed}
- {fr: SIPO_ELNO, en: beam section stresses at element nodes, kind: concept, note: "Stress in the beam section due to each force (SN, SVY, SVZ, SMT, SMFY, SMFZ), not combined. CALC_CHAMP CONTRAINTE.", source: "code_aster/Cata/Commons/c_nom_cham_into.py:103", status: proposed}
- {fr: EPOT_ELEM, en: strain energy per element, kind: concept, note: "Elastic strain energy of each element ('Énergie potentielle de déformation élastique par élément'); component TOTALE, plus a split for shells and beams. CALC_CHAMP ENERGIE.", source: "code_aster/Cata/Commons/c_nom_cham_into.py:244", status: proposed}
- {fr: VITE, en: velocity, kind: concept, note: "Nodal velocity field of dynamic results ('Vitesse aux noeuds'); components DX..DRZ.", source: "code_aster/Cata/Commons/c_nom_cham_into.py:442", status: proposed}
- {fr: ACCE, en: acceleration, kind: concept, note: "Nodal acceleration field of dynamic results ('Accélération aux noeuds'); components DX..DRZ.", source: "code_aster/Cata/Commons/c_nom_cham_into.py:436", status: proposed}
# components: DOFs (DEPL, VITE, ACCE; forces in FORC_NODA / REAC_NODA)
- {fr: DX, en: X translation, kind: concept, note: "DOF and component name, global axes ('translation suivant X'). In DEPL the displacement along X; in FORC_NODA / REAC_NODA the force along X (these fields reuse the DOF names). In AXIS, the radial direction.", source: "catalo/cataelem/Commons/physical_quantities.py:857", status: proposed}
- {fr: DY, en: Y translation, kind: concept, note: "As DX, along global Y. In AXIS, the axial direction.", source: "catalo/cataelem/Commons/physical_quantities.py:857", status: proposed}
- {fr: DZ, en: Z translation, kind: concept, note: "As DX, along global Z.", source: "catalo/cataelem/Commons/physical_quantities.py:857", status: proposed}
- {fr: DRX, en: rotation about X, kind: concept, note: "Rotation DOF (radians), global axes ('rotation autour de X'); shells and beams only. In FORC_NODA / REAC_NODA the moment about X.", source: "catalo/cataelem/Commons/physical_quantities.py:858", status: proposed}
- {fr: DRY, en: rotation about Y, kind: concept, note: "As DRX, about global Y.", source: "catalo/cataelem/Commons/physical_quantities.py:858", status: proposed}
- {fr: DRZ, en: rotation about Z, kind: concept, note: "As DRX, about global Z. For shells the rotation about the normal has only a fictitious stiffness.", source: "catalo/cataelem/Commons/physical_quantities.py:858", status: proposed}
# components: stress and strain tensors
- {fr: SIYY, en: normal stress YY, kind: concept, note: "Stress component (SIGM_*, SIEF_*): normal stress in Y.", source: "catalo/cataelem/Commons/physical_quantities.py:3493", status: proposed}
- {fr: SIZZ, en: normal stress ZZ, kind: concept, note: "Stress component: normal stress in Z. Present in 2D too (plane strain, axisymmetric hoop stress).", source: "catalo/cataelem/Commons/physical_quantities.py:3494", status: proposed}
- {fr: SIXZ, en: shear stress XZ, kind: concept, note: "Stress component: shear stress in the XZ plane (3D only).", source: "catalo/cataelem/Commons/physical_quantities.py:3496", status: proposed}
- {fr: SIYZ, en: shear stress YZ, kind: concept, note: "Stress component: shear stress in the YZ plane (3D only).", source: "catalo/cataelem/Commons/physical_quantities.py:3497", status: proposed}
- {fr: EPXX, en: normal strain XX, kind: concept, note: "Strain component (EPSI_*): epsilon_xx. In beam DEGE_* fields, the axial strain.", source: "catalo/cataelem/Commons/physical_quantities.py:1279", status: proposed}
- {fr: EPYY, en: normal strain YY, kind: concept, note: "Strain component: epsilon_yy.", source: "catalo/cataelem/Commons/physical_quantities.py:1280", status: proposed}
- {fr: EPZZ, en: normal strain ZZ, kind: concept, note: "Strain component: epsilon_zz.", source: "catalo/cataelem/Commons/physical_quantities.py:1281", status: proposed}
- {fr: EPXY, en: shear strain XY (tensor), kind: concept, note: "Strain component: tensor shear strain epsilon_xy = gamma_xy / 2 (bibfor/elements/eps1mc.F90:96).", source: "catalo/cataelem/Commons/physical_quantities.py:1282", status: proposed}
- {fr: EPXZ, en: shear strain XZ (tensor), kind: concept, note: "Strain component: tensor shear strain epsilon_xz = gamma_xz / 2.", source: "catalo/cataelem/Commons/physical_quantities.py:1283", status: proposed}
- {fr: EPYZ, en: shear strain YZ (tensor), kind: concept, note: "Strain component: tensor shear strain epsilon_yz = gamma_yz / 2.", source: "catalo/cataelem/Commons/physical_quantities.py:1284", status: proposed}
# components: equivalent quantities
- {fr: TRSIG, en: stress trace, kind: concept, note: "SIEQ_* component: sigma_xx + sigma_yy + sigma_zz (bibfor/algorith/fgequi.F90:194).", source: "catalo/cataelem/Commons/located_components.py:931", status: proposed}
- {fr: TRIAX, en: stress triaxiality, kind: concept, note: "SIEQ_* component: mean stress (trace / 3) divided by VMIS; 0 where VMIS is near zero (bibfor/algorith/fgequi.F90:199). 'Taux de triaxialite'.", source: "catalo/cataelem/Commons/physical_quantities.py:3607", status: proposed}
- {fr: INVA_2, en: equivalent strain (second invariant), kind: concept, note: "EPEQ_* component: sqrt(2/3 e:e) with e the deviatoric strain (bibfor/algorith/lciv2e.F90). As CHAM_UTIL CRITERE, the same invariant of the input tensor.", source: "catalo/cataelem/Commons/physical_quantities.py:1296", status: proposed}
- {fr: INVA_2SG, en: signed equivalent strain, kind: concept, note: "EPEQ_* component: INVA_2 with the sign of the strain trace (volume change).", source: "catalo/cataelem/Commons/physical_quantities.py:1300", status: proposed}
# components: shell resultants (EFGE_*, local axes, per unit length)
- {fr: NXX, en: membrane force XX, kind: concept, note: "Shell EFGE_* component: membrane normal force per unit length along local x.", source: "catalo/cataelem/Elements/meca_dkt.py:165", status: proposed}
- {fr: NYY, en: membrane force YY, kind: concept, note: "Shell EFGE_* component: membrane normal force per unit length along local y.", source: "catalo/cataelem/Elements/meca_dkt.py:165", status: proposed}
- {fr: NXY, en: membrane shear force XY, kind: concept, note: "Shell EFGE_* component: in-plane shear force per unit length.", source: "catalo/cataelem/Elements/meca_dkt.py:165", status: proposed}
- {fr: MXX, en: bending moment XX, kind: concept, note: "Shell EFGE_* component: bending moment per unit length (force x length / length). Sign depends on the shell normal.", source: "catalo/cataelem/Elements/meca_dkt.py:165", status: proposed}
- {fr: MYY, en: bending moment YY, kind: concept, note: "Shell EFGE_* component: bending moment per unit length.", source: "catalo/cataelem/Elements/meca_dkt.py:165", status: proposed}
- {fr: MXY, en: twisting moment XY, kind: concept, note: "Shell EFGE_* component: twisting moment per unit length.", source: "catalo/cataelem/Elements/meca_dkt.py:165", status: proposed}
- {fr: QX, en: transverse shear force X, kind: concept, note: "Shell EFGE_* component: out-of-plane shear force per unit length on the face normal to local x.", source: "catalo/cataelem/Elements/meca_dkt.py:165", status: proposed}
- {fr: QY, en: transverse shear force Y, kind: concept, note: "Shell EFGE_* component: out-of-plane shear force per unit length on the face normal to local y.", source: "catalo/cataelem/Elements/meca_dkt.py:165", status: proposed}
# components: beam forces (EFGE_*, SIEF_* of beams, local axes)
- {fr: N, en: axial force, kind: concept, note: "Beam EFGE_* / SIEF_* component: 'effort normal' along the local x (beam) axis.", source: "catalo/cataelem/Commons/physical_quantities.py:3498", status: proposed}
- {fr: VY, en: shear force Y, kind: concept, note: "Beam component: shear force along local y.", source: "catalo/cataelem/Commons/physical_quantities.py:3499", status: proposed}
- {fr: VZ, en: shear force Z, kind: concept, note: "Beam component: shear force along local z.", source: "catalo/cataelem/Commons/physical_quantities.py:3500", status: proposed}
- {fr: MT, en: torsional moment, kind: concept, note: "Beam component: moment about the local x (beam) axis.", source: "catalo/cataelem/Commons/physical_quantities.py:3501", status: proposed}
- {fr: MFY, en: bending moment Y, kind: concept, note: "Beam component: bending moment about local y.", source: "catalo/cataelem/Commons/physical_quantities.py:3502", status: proposed}
- {fr: MFZ, en: bending moment Z, kind: concept, note: "Beam component: bending moment about local z.", source: "catalo/cataelem/Commons/physical_quantities.py:3503", status: proposed}
- {fr: TOTALE, en: total, kind: concept, note: "EPOT_ELEM component: total strain energy of the element (other components split it by membrane, bending, ...).", source: "catalo/cataelem/Commons/located_components.py:181", status: proposed}
# modal result parameters
- {fr: NUME_MODE, en: mode number, kind: keyword, note: "Rank of a mode in a modal result; access parameter, selects modes in CALC_CHAMP, IMPR_RESU, TEST_RESU.", source: "code_aster/Cata/Commands/calc_champ.py:66", status: proposed}
- {fr: OMEGA2, en: squared angular frequency, kind: concept, note: "Modal result parameter: (2 pi f)^2.", source: "bibfor/algeline/vpstor.F90:84", status: proposed}
- {fr: MASS_GENE, en: generalized mass, kind: concept, note: "Modal result parameter: phi^T M phi for the stored (normalized) mode shape, so it depends on the normalization.", source: "bibfor/algeline/vpstor.F90:85", status: proposed}
- {fr: RIGI_GENE, en: generalized stiffness, kind: concept, note: "Modal result parameter: phi^T K phi for the stored mode shape.", source: "bibfor/algeline/vpstor.F90:85", status: proposed}
- {fr: FACT_PARTICI, en: participation factor, kind: concept, note: "Modal result parameters FACT_PARTICI_DX/DY/DZ: participation of the mode in a rigid-body motion along X, Y, Z.", source: "bibfor/algeline/vpstor.F90:87", status: proposed}
- {fr: MASS_EFFE, en: effective modal mass, kind: concept, note: "Modal result parameters MASS_EFFE_DX/DY/DZ: mass moved by the mode along X, Y, Z. MASS_EFFE_UN_* is the fraction of the total.", source: "bibfor/algeline/vpstor.F90:86", status: proposed}
# proposed by caen translate messages (task 3.1); review before use
- {fr: mot-clé facteur, en: factor keyword, kind: term, note: 'Keyword that groups sub-keywords and may be repeated, written with _F(...) (AFFE, EXCIT, POUTRE). Also spelled ''mot clef facteur'' in messages.', status: proposed}
- {fr: fibre, en: fiber, kind: term, note: 'Multifiber beams (AFFE_CARA_ELEM MULTIFIBRE, DEFI_GEOM_FIBRE): the beam section is split into fibers integrated separately.', source: 'code_aster/Messages/modelisa8.py:40', status: proposed}
