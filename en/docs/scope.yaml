# Which official documents `caen translate doc` translates into en/docs/, and which chunks.
# Human-edited data (CLAUDE.md §5); task 5.2, ADR-027.
#
# Keys are doc IDs of en/docs/_src/<DOC-ID>.fr.json. `chunks` lists the translated chunks
# ("1-4, 107"; default: every chunk) by the chunk numbers of `<DOC-ID>.fr.md`
# (`<!-- chunk N -->`). The other chunks keep their French headings, marked "not translated",
# so section numbers still resolve. `reason` says why a document is cut, from the keywords of
# docs/COMMAND-SET.md (CLAUDE.md §2 rule 7). Re-check the chunk numbers after a re-ingest.
