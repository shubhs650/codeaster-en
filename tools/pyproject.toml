[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "codeaster_en"
version = "0.1.0"
description = "English overlay tooling for the code_aster finite element solver"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pyyaml>=6",
    "jinja2>=3.1",
    # Markdown -> HTML for the report (task 4.6).
    "markdown>=3.5",
    # MED/HDF5 results reader, codeaster_en.results (task 4.5, ADR-015).
    "numpy>=1.26",
    "h5py>=3.10",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pytest>=8",
    "pyyaml>=6",
    "jsonschema>=4",
    "numpy>=1.26",
    "h5py>=3.10",
    # Independent MED library, only to cross-check the native reader in tests (ADR-015).
    "medcoupling>=9.12",
    "markdown>=3.5",
    "weasyprint>=62",
]

# PDF output of `caen report` (task 4.6); needs the Pango system library.
report = [
    "weasyprint>=62",
]

# Claude API backend of `caen translate messages` (task 3.1); not needed for tests or CI.
llm = [
    "anthropic>=2.3",
]

[project.scripts]
caen = "codeaster_en.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["codeaster_en*"]

[tool.setuptools.package-data]
"codeaster_en.translate" = ["templates/*.j2"]
"codeaster_en.report" = ["templates/*.j2", "templates/*.css"]
