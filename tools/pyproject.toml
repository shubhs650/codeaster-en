[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "codeaster-en"
# <upstream tag>.<overlay serial>, single-sourced in codeaster_en/__init__.py (ADR-020).
dynamic = ["version"]
description = "English overlay for the code_aster finite element solver: catalog, messages, logs, results, reports"
readme = "README.md"
license = "GPL-3.0-or-later"
authors = [{ name = "codeaster-en contributors" }]
keywords = ["code_aster", "finite element", "FEA", "translation", "gettext"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pyyaml>=6",
    "jinja2>=3.1",
    # Markdown -> HTML for the report (task 4.6).
    "markdown>=3.5",
    # MED/HDF5 results reader, codeaster_en.results (task 4.5, ADR-015).
    "numpy>=1.26",
    "h5py>=3.10",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pytest>=8",
    "pyyaml>=6",
    "jsonschema>=4",
    "numpy>=1.26",
    "h5py>=3.10",
    # Independent MED library, only to cross-check the native reader in tests (ADR-015).
    "medcoupling>=9.12",
    "markdown>=3.5",
    "weasyprint>=62",
    "pyvista>=0.44",
    "pdfplumber>=0.11",
]

# PDF output of `caen report` (task 4.6); needs the Pango system library.
report = [
    "weasyprint>=62",
]

# Result images in `caen report --images` (task 4.7); needs off-screen OpenGL (OSMesa or EGL).
images = [
    "pyvista>=0.44",
]

# PDF ingestion of the official French documents, `caen docs ingest` (task 5.1).
docs = [
    "pdfplumber>=0.11",
]

# Claude API backend of `caen translate messages` (task 3.1); not needed for tests or CI.
llm = [
    "anthropic>=2.3",
]

[project.urls]
Repository = "https://github.com/shubhs650/codeaster-en"
Issues = "https://github.com/shubhs650/codeaster-en/issues"

[project.scripts]
caen = "codeaster_en.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["codeaster_en*"]

[tool.setuptools.dynamic]
version = { attr = "codeaster_en.__version__" }

# en/ data is staged into codeaster_en/_data by setup.py (ADR-020); the glob picks it up again
# when a wheel is built from the sdist.
[tool.setuptools.package-data]
"codeaster_en" = ["_data/**/*"]
"codeaster_en.translate" = ["templates/*.j2"]
"codeaster_en.report" = ["templates/*.j2", "templates/*.css"]
