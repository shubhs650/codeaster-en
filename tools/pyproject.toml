[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "codeaster_en"
version = "0.1.0"
description = "English overlay tooling for the code_aster finite element solver"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pyyaml>=6",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pytest>=8",
    "pyyaml>=6",
    "jsonschema>=4",
    "numpy>=1.26",
    "h5py>=3.10",
]

[project.scripts]
caen = "codeaster_en.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["codeaster_en*"]

[tool.setuptools.package-data]
"codeaster_en.translate" = ["templates/*.j2"]
